name: Test job_name not found produces parse error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies and mock curl returning jobs with different name
        run: |
          # Ensure jq is available
          if ! command -v jq &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
          # Install mock curl that returns a job with a different name
          printf '%s\n' '#!/bin/bash' \
            'echo '"'"'{"total_count":1,"jobs":[{"id":99999,"name":"some-other-job","html_url":"https://github.com/owner/repo/actions/runs/1/jobs/99999","status":"completed","conclusion":"success"}]}'"'"'' \
            > /usr/local/bin/curl
          chmod +x /usr/local/bin/curl
          # Verify mock curl works
          /usr/local/bin/curl | grep -q "some-other-job" && echo "mock curl OK"

      - name: Run action with nonexistent job_name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_API_URL: https://api.github.com
        with:
          github_token: fake-token
          repository: owner/repo
          run_id: "1"
          job_name: "this-job-name-does-not-exist-xyz-12345"
          per_page: 30

      - name: Assert action failed due to job_name not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when job_name is not found, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when job_name does not exist"
