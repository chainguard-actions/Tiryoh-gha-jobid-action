name: Test job name not found error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl to simulate valid jobs response with different job name
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/bash
          # Fake curl that returns a valid jobs response with a different job name
          echo '{"total_count":1,"jobs":[{"id":99999,"name":"some-other-job","html_url":"https://github.com/octocat/Hello-World/actions/runs/1/jobs/99999"}]}'
          EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
      - name: Test action fails when job name does not match
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-token"
          job_name: "this-job-name-does-not-exist-xyz-12345"
          repository: "octocat/Hello-World"
          run_id: "1"
      - name: Assert action failed due to job name not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when job name is not found, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when job name was not found"
