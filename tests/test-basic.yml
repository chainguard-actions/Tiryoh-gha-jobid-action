name: Test basic usage - get job_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock curl
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/curl << 'EOF'
          #!/bin/bash
          # Mock curl that returns a fake GitHub API response
          cat << 'RESPONSE'
          {
            "jobs": [
              {
                "id": 123456789,
                "name": "test",
                "html_url": "https://github.com/owner/repo/actions/runs/999/jobs/123456789",
                "status": "in_progress",
                "conclusion": null
              }
            ]
          }
          RESPONSE
          EOF
          chmod +x /tmp/mock-bin/curl
          echo "Mock curl installed"

      - id: action
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          GITHUB_REPOSITORY: owner/repo
          GITHUB_RUN_ID: "999"
        with:
          github_token: fake-token
          job_name: test

      - name: Assert job_id is correct
        env:
          JOB_ID: ${{ steps.action.outputs.job_id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "job_id: $JOB_ID"
          echo "html_url: $HTML_URL"
          if [ -z "$JOB_ID" ]; then
            echo "FAIL: job_id output is empty"
            exit 1
          fi
          if [ "$JOB_ID" = "null" ]; then
            echo "FAIL: job_id is null"
            exit 1
          fi
          if [ "$JOB_ID" != "123456789" ]; then
            echo "FAIL: expected job_id=123456789, got $JOB_ID"
            exit 1
          fi
          echo "PASS: job_id=$JOB_ID"
