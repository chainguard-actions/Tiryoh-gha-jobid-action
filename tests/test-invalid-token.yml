name: Test invalid token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl to simulate resource not accessible response
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/bash
          # Fake curl that returns "Resource not accessible by integration"
          echo '{"message":"Resource not accessible by integration","documentation_url":"https://docs.github.com/rest"}'
          EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
      - name: Test action fails with resource not accessible response
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-invalid-token-abc123"
          job_name: "test"
          repository: "octocat/Hello-World"
          run_id: "1"
      - name: Assert action failed due to resource not accessible
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with resource not accessible response, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with resource not accessible response"
