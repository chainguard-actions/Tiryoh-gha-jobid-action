name: Test explicit repository and run_id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, GITHUB_RUN_ID is synthetic and not a real GitHub API run.
      # Fetch a real completed run and its first job from the repository API.
      - name: Find a real run_id and job_name from the repository
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          # Get the most recent completed workflow runs
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPO}/actions/runs?status=completed&per_page=5")
          echo "Runs response: $(echo "$RUNS" | head -c 500)"
          RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "SKIP: No completed runs found, cannot test"
            echo "run_id=" >> $GITHUB_OUTPUT
            echo "job_name=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found run_id: $RUN_ID"
          # Get the first job from that run
          JOBS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=30")
          JOB_NAME=$(echo "$JOBS" | jq -r '.jobs[0].name // empty')
          if [ -z "$JOB_NAME" ]; then
            echo "SKIP: No jobs found for run $RUN_ID"
            echo "run_id=" >> $GITHUB_OUTPUT
            echo "job_name=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found job_name: $JOB_NAME"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "job_name=$JOB_NAME" >> $GITHUB_OUTPUT

      - name: Skip if no real run found
        if: steps.find-run.outputs.run_id == ''
        run: |
          echo "No real GitHub Actions run found to test against. Skipping."
          exit 0

      - id: action
        if: steps.find-run.outputs.run_id != ''
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run_id: ${{ steps.find-run.outputs.run_id }}
          job_name: ${{ steps.find-run.outputs.job_name }}
          per_page: 30

      - name: Assert job_id is non-empty and numeric
        if: steps.find-run.outputs.run_id != ''
        env:
          JOB_ID: ${{ steps.action.outputs.job_id }}
        run: |
          echo "job_id: $JOB_ID"
          if [ -z "$JOB_ID" ]; then
            echo "FAIL: job_id is empty"
            exit 1
          fi
          if echo "$JOB_ID" | grep -q "null"; then
            echo "FAIL: job_id is null"
            exit 1
          fi
          if ! echo "$JOB_ID" | grep -qE '^[0-9]+$'; then
            echo "FAIL: job_id is not a numeric value: $JOB_ID"
            exit 1
          fi
          echo "PASS: job_id=$JOB_ID"

      - name: Assert html_url contains the repository name
        if: steps.find-run.outputs.run_id != ''
        env:
          HTML_URL: ${{ steps.action.outputs.html_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "html_url: $HTML_URL"
          echo "repository: $REPO"
          if [ -z "$HTML_URL" ]; then
            echo "FAIL: html_url is empty"
            exit 1
          fi
          if echo "$HTML_URL" | grep -q "null"; then
            echo "FAIL: html_url is null"
            exit 1
          fi
          if ! echo "$HTML_URL" | grep -qE '^https://'; then
            echo "FAIL: html_url does not start with https://: $HTML_URL"
            exit 1
          fi
          # Verify the URL contains the repo name (owner/repo -> just repo part)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          if ! echo "$HTML_URL" | grep -q "$REPO_NAME"; then
            echo "FAIL: html_url does not contain repo name '$REPO_NAME': $HTML_URL"
            exit 1
          fi
          echo "PASS: html_url=$HTML_URL"
