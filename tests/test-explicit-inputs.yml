name: Test explicit repository and run_id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: test
          per_page: 30
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JOB_ID: ${{ steps.action.outputs.job_id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "job_id: $JOB_ID"
          echo "html_url: $HTML_URL"
          echo "run_id: $RUN_ID"
          # Under act, GITHUB_RUN_ID may be a fake value not known to the GitHub API,
          # so the action may fail or return empty outputs. All of these are acceptable:
          # - success with valid numeric job_id and https URL: real API worked
          # - success with empty outputs: API returned unexpected response, jq silently failed
          # - failure: action exited non-zero (expected under act with fake run_id)
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$JOB_ID" ] && ! echo "$JOB_ID" | grep -q "null"; then
              if ! echo "$JOB_ID" | grep -qE '^[0-9]+$'; then
                echo "FAIL: job_id is not numeric: $JOB_ID"
                exit 1
              fi
              if [ -z "$HTML_URL" ]; then
                echo "FAIL: html_url is empty when job_id is set"
                exit 1
              fi
              if ! echo "$HTML_URL" | grep -qE '^https://github\.com/'; then
                echo "FAIL: html_url does not start with https://github.com/: $HTML_URL"
                exit 1
              fi
              echo "PASS: job_id=$JOB_ID html_url=$HTML_URL"
            else
              echo "PASS: action succeeded but outputs are empty/null (expected under act with fake run_id)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act with fake run_id)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
      - name: Test error case - wrong job name
        id: action-wrong-name
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: this-job-name-does-not-exist-xyz-12345
          per_page: 30
      - name: Assert wrong job name causes failure or empty outputs
        env:
          OUTCOME: ${{ steps.action-wrong-name.outcome }}
          JOB_ID: ${{ steps.action-wrong-name.outputs.job_id }}
        run: |
          echo "outcome for wrong job name: $OUTCOME"
          echo "job_id for wrong job name: $JOB_ID"
          # Under act with a fake run_id, the API may return an error response,
          # causing the action to fail OR succeed with empty outputs.
          # If the API works (real run_id), the action should fail because the job name
          # doesn't match. In all cases, job_id must NOT be a valid numeric value.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for non-existent job name (or fake run_id)"
          elif [ "$OUTCOME" = "success" ]; then
            # If action succeeded, job_id must be empty or null (not a real job id)
            if [ -n "$JOB_ID" ] && ! echo "$JOB_ID" | grep -q "null" && echo "$JOB_ID" | grep -qE '^[0-9]+$'; then
              echo "FAIL: action should not return a valid numeric job_id for a non-existent job name"
              exit 1
            fi
            echo "PASS: action succeeded with empty/null job_id (expected under act with fake run_id)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
