name: Test default env var fallback for repository and run_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_RUN_ID: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock curl
        run: |
          # Under act, GITHUB_WORKSPACE is the action directory itself
          # so fixtures are at $GITHUB_WORKSPACE/tests/fixtures/
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl-no-match.sh" /usr/local/bin/curl
          chmod +x /usr/local/bin/curl
          echo "Mock curl installed at $(which curl)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          job_name: nonexistent-job-name
          # repository and run_id are intentionally omitted to test env var fallback
      - name: Assert action failed when job not found using env var fallback
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the job name doesn't exist in the run.
          # This confirms the action correctly fell back to GITHUB_REPOSITORY and
          # GITHUB_RUN_ID env vars and made an API call (which returned no matching job).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when job name is not found, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly used env var fallback and failed when job was not found"
