name: Test invalid job name returns error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock curl
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/curl << 'EOF'
          #!/bin/bash
          # Mock curl that returns a fake GitHub API response with a different job name
          cat << 'RESPONSE'
          {
            "jobs": [
              {
                "id": 123456789,
                "name": "some-other-job",
                "html_url": "https://github.com/owner/repo/actions/runs/999/jobs/123456789",
                "status": "in_progress",
                "conclusion": null
              }
            ]
          }
          RESPONSE
          EOF
          chmod +x /tmp/mock-bin/curl
          echo "Mock curl installed"

      - id: action
        uses: .
        continue-on-error: true
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          GITHUB_REPOSITORY: owner/repo
          GITHUB_RUN_ID: "999"
        with:
          github_token: fake-token
          job_name: this-job-name-does-not-exist-xyz-12345

      - name: Assert action failed for invalid job name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid job name, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid job name"
