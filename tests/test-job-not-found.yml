name: Test job not found error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_RUN_ID: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock curl
        run: |
          # Under act, GITHUB_WORKSPACE is the action directory itself
          # so fixtures are at $GITHUB_WORKSPACE/tests/fixtures/
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl-no-match.sh" /usr/local/bin/curl
          chmod +x /usr/local/bin/curl
          echo "Mock curl installed at $(which curl)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          repository: owner/repo
          run_id: "1"
          job_name: nonexistent-job-name-that-will-not-be-found
      - name: Assert action failed when job not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when job name is not found, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when job was not found"
