name: Test invalid run_id produces parse error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies and mock curl returning empty jobs list
        run: |
          # Ensure jq is available
          if ! command -v jq &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
          # Install mock curl that returns empty jobs list (simulates invalid run_id)
          printf '%s\n' '#!/bin/bash' \
            'echo '"'"'{"total_count":0,"jobs":[]}'"'"'' \
            > /usr/local/bin/curl
          chmod +x /usr/local/bin/curl
          # Verify mock curl works
          /usr/local/bin/curl | grep -q "total_count" && echo "mock curl OK"

      - name: Run action with invalid run_id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_API_URL: https://api.github.com
        with:
          github_token: fake-token
          repository: owner/repo
          run_id: "0"
          job_name: "nonexistent-job"
          per_page: 30

      - name: Assert action failed due to parse error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid run_id, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when run_id is invalid"
