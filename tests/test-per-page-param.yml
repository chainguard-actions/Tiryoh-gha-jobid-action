name: Test per_page parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_RUN_ID: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock curl that captures URL
        run: |
          # Under act, GITHUB_WORKSPACE is the action directory itself
          # so fixtures are at $GITHUB_WORKSPACE/tests/fixtures/
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl-capture-url.sh" /usr/local/bin/curl
          chmod +x /usr/local/bin/curl
          echo "Mock curl installed at $(which curl)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          repository: owner/repo
          run_id: "1"
          job_name: nonexistent-job-name
          per_page: "100"
      - name: Assert action failed when job not found with per_page set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when job name is not found (per_page=100), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when job was not found (per_page=100)"
      - name: Assert per_page=100 was passed to curl
        run: |
          if [ ! -f /tmp/curl_url_captured.txt ]; then
            echo "FAIL: curl URL was not captured - mock curl may not have been invoked"
            exit 1
          fi
          CAPTURED=$(cat /tmp/curl_url_captured.txt)
          echo "captured URL fragment: $CAPTURED"
          if ! echo "$CAPTURED" | grep -q "per_page=100"; then
            echo "FAIL: expected per_page=100 in curl URL, got: $CAPTURED"
            exit 1
          fi
          echo "PASS: per_page=100 was correctly passed to curl"
