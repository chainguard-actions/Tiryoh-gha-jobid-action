name: Test per_page input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fetch a real recent run and one of its job names from the GitHub API
      - name: Get a real run_id and job_name from GitHub API
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get the most recent completed workflow run (use -sS not -sSf to avoid exit 1 on HTTP errors)
          RUNS=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs?status=completed&per_page=10" 2>/dev/null || echo '{}')
          RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            # Try without status filter
            RUNS=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs?per_page=10" 2>/dev/null || echo '{}')
            RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)
          fi
          if [ -z "$RUN_ID" ]; then
            echo "SKIP: no runs found, cannot test"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "job_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Get the first job name from that run
          JOBS=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=5" 2>/dev/null || echo '{}')
          JOB_NAME=$(echo "$JOBS" | jq -r '.jobs[0].name // empty' 2>/dev/null || true)
          if [ -z "$JOB_NAME" ]; then
            echo "SKIP: no jobs found for run $RUN_ID"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "job_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found run_id=$RUN_ID job_name=$JOB_NAME"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Skip if no real run available
        if: steps.setup.outputs.run_id == ''
        run: |
          echo "No runs available to test against — skipping"
          exit 0

      - id: action
        if: steps.setup.outputs.run_id != ''
        uses: .
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          run_id: ${{ steps.setup.outputs.run_id }}
          job_name: ${{ steps.setup.outputs.job_name }}
          per_page: 100

      - name: Assert job_id is non-empty and non-null with per_page=100
        if: steps.setup.outputs.run_id != ''
        env:
          JOB_ID: ${{ steps.action.outputs.job_id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "job_id: $JOB_ID"
          echo "html_url: $HTML_URL"
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "FAIL: job_id is empty or null"
            exit 1
          fi
          if [ -z "$HTML_URL" ] || [ "$HTML_URL" = "null" ]; then
            echo "FAIL: html_url is empty or null"
            exit 1
          fi
          if ! echo "$HTML_URL" | grep -q "github.com"; then
            echo "FAIL: html_url does not contain github.com"
            exit 1
          fi
          echo "PASS: job_id=$JOB_ID html_url=$HTML_URL (per_page=100)"
